<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LerMais - Crie sua Conta</title>
    <link rel="stylesheet" href="csc.css">
</head>
<body>

    <header class="fade-in-element">
        <strong class="logo">Ler<span>Mais</span></strong>
        <button type="button" id="themeToggleBtn" class="theme-toggle" aria-label="Alternar tema"></button>
    </header>

    <main id="mainContent">
        <section class="card-register fade-in-element" id="registerCard">
            <h1>Crie sua Conta</h1>
            <p>Salve seu progresso e sincronize sua estante</p>

            <form id="registerForm" novalidate>
                <p class="input-group">
                    <label for="fullName">Nome completo:</label>
                    <input type="text" id="fullName" autocomplete="name">
                    <span class="live-requirements" id="nameReqList">
                        <span id="reqNameLength">○ Digite seu nome e sobrenome</span>
                    </span>
                    <span class="error-message" id="nameError"></span>
                </p>

                <p class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" autocomplete="email">
                    <span class="live-requirements" id="emailReqList">
                        <span id="reqEmailStructure">○ Formato de email válido (ex@email.com)</span>
                    </span>
                    <span class="error-message" id="emailError"></span>
                </p>

                <p class="input-group toggle-container">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" autocomplete="new-password">
                    <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar senha"></button>
                    
                    <span class="strength-segments" id="strengthSegments">
                        <span class="segment"></span>
                        <span class="segment"></span>
                        <span class="segment"></span>
                    </span>

                    <span class="live-requirements" id="reqList">
                        <span id="reqLength">○ Mínimo de 6 caracteres</span>
                        <span id="reqAlphaNum">○ Letra maiúscula e número</span>
                        <span id="reqSpecial">○ Caractere especial (!@#$)</span>
                    </span>

                    <span class="error-message" id="passwordError"></span>
                </p>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Finalizar e Entrar</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <footer class="card-footer">
                Já tem uma conta? <a href="#">Entrar</a>
            </footer>
        </section>
    </main>

    <script src="csc.js"></script>
</body>
</html>
